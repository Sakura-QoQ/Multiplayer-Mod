services:
  room-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: fallen-flower-room-server:latest
    container_name: fallen-flower-room-server
    restart: unless-stopped
    init: true
    ports:
      - "${FF_ROOM_PORT:-27777}:${FF_ROOM_PORT:-27777}/tcp"
    environment:
      FF_ROOM_LISTEN: "0.0.0.0"
      FF_ROOM_PORT: "${FF_ROOM_PORT:-27777}"
      FF_ROOM_MAX_ROOMS: "${FF_ROOM_MAX_ROOMS:-256}"
      FF_ROOM_MAX_PLAYERS: "${FF_ROOM_MAX_PLAYERS:-8}"
      FF_ROOM_ADMIN_TOKEN: "${FF_ROOM_ADMIN_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
